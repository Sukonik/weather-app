<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
    <title>Rain Data — ClearSky</title>
    <link rel="stylesheet" href="styles.css?v=20260901a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" class="loading-overlay"><div class="loading-spinner"></div><span>Loading precipitation data...</span></div>
    <div id="error" class="error-message"></div>
    <div class="container">
        <div id="app-chrome"></div>

        <main>
            <div class="page-hero">
                <h2 class="section-label">Rain &amp; Precipitation</h2>
                <div class="page-hero-value" id="precip-current-value">-- mm</div>
                <div class="page-hero-sub" id="precip-prob-value">Chance of rain: --%</div>
            </div>

            <div class="stat-grid">
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-cloud-rain"></i><span>RAIN TODAY</span></div>
                    <div class="card-value" id="rain-today">--</div>
                </div>
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-cloud-showers-heavy"></i><span>SHOWERS TODAY</span></div>
                    <div class="card-value" id="showers-today">--</div>
                </div>
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-snowflake"></i><span>SNOW TODAY</span></div>
                    <div class="card-value" id="snow-today">--</div>
                </div>
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-water"></i><span>TOTAL TODAY</span></div>
                    <div class="card-value" id="total-today">--</div>
                </div>
            </div>

            <div class="hourly-card">
                <div class="card-header-row"><h3>NEXT 8 HOURS</h3></div>
                <div class="hourly-strip" id="next8-strip"></div>
            </div>

            <div class="hourly-card">
                <div class="card-header-row"><h3>PRECIPITATION PROBABILITY — 24H</h3></div>
                <canvas id="rain-chart" width="600" height="220"></canvas>
            </div>

            <div class="hourly-card">
                <div class="card-header-row"><h3>7-DAY OUTLOOK</h3></div>
                <div class="daily-outlook" id="daily-outlook"></div>
            </div>

            <div class="data-footer" id="data-footer">
                <i class="fas fa-database"></i>
                <span id="data-source-text">Source: Open-Meteo Forecast API</span>
                <span class="data-footer-sep">·</span>
                <span id="data-timestamp-text">Updated: --</span>
            </div>
        </main>
    </div>
    <script type="module" src="js/pages/rain.js?v=20260901a"></script>
</body>
</html>
