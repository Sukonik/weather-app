<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
    <title>Moon Phases — ClearSky</title>
    <link rel="stylesheet" href="styles.css?v=20260807b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" class="loading-overlay"><div class="loading-spinner"></div><span>Loading moon data...</span></div>
    <div id="error" class="error-message"></div>
    <div class="container">
        <div id="app-chrome"></div>

        <main>
            <div class="page-hero">
                <h2 class="section-label">Moon Phases</h2>
                <div class="moon-icon" id="moon-icon">🌙</div>
                <div class="page-hero-value" id="moon-phase-value">--</div>
                <div class="page-hero-sub" id="moon-illum-value">Illumination: --%</div>
            </div>

            <div class="stat-grid">
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-arrow-up"></i><span>MOONRISE</span></div>
                    <div class="card-value" id="moonrise-value">--</div>
                </div>
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-arrow-down"></i><span>MOONSET</span></div>
                    <div class="card-value" id="moonset-value">--</div>
                </div>
                <div class="detail-card">
                    <div class="card-header"><i class="fas fa-arrows-up-down"></i><span>TRANSIT</span></div>
                    <div class="card-value" id="transit-value">--</div>
                </div>
            </div>

            <div class="hourly-card">
                <div class="card-header-row"><h3>UPCOMING PHASES</h3></div>
                <div class="moon-phases-list" id="moon-phases-list"></div>
            </div>

            <div class="data-footer" id="data-footer">
                <i class="fas fa-database"></i>
                <span id="data-source-text">Source: U.S. Naval Observatory</span>
                <span class="data-footer-sep">·</span>
                <span id="data-timestamp-text">Updated: --</span>
            </div>
        </main>
    </div>
    <script type="module" src="js/pages/moon.js?v=20260807b"></script>
</body>
</html>
