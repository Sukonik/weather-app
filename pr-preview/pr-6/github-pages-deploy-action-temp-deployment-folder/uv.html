<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
    <title>UV Index — ClearSky</title>
    <link rel="stylesheet" href="styles.css?v=20260821a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" class="loading-overlay"><div class="loading-spinner"></div><span>Loading UV data...</span></div>
    <div id="error" class="error-message"></div>
    <div class="container">
        <div id="app-chrome"></div>

        <main>
            <div class="page-hero">
                <h2 class="section-label">UV Index</h2>
                <div class="page-hero-value" id="uv-page-value">--</div>
                <div class="page-hero-status" id="uv-page-status">--</div>
                <div class="page-hero-sub" id="uv-peak-value">Today's peak: --</div>
            </div>

            <div class="hourly-card">
                <div class="card-header-row"><h3>HOURLY UV — 24H</h3></div>
                <canvas id="uv-chart" width="600" height="220"></canvas>
                <div class="wind-legend uv-legend">
                    <span class="legend-item sev-1">Low (0–2)</span>
                    <span class="legend-item sev-2">Moderate (3–5)</span>
                    <span class="legend-item sev-3">High (6–7)</span>
                    <span class="legend-item sev-5">Very High (8–10)</span>
                    <span class="legend-item sev-6">Extreme (11+)</span>
                </div>
            </div>

            <div class="detail-card uv-safety-card">
                <div class="card-header"><i class="fas fa-shield-halved"></i><span>SAFETY GUIDE</span></div>
                <p class="card-description" id="uv-safety-text">Select a location to see sun-safety guidance.</p>
            </div>

            <div class="data-footer" id="data-footer">
                <i class="fas fa-database"></i>
                <span id="data-source-text">Source: Open-Meteo Forecast API</span>
                <span class="data-footer-sep">·</span>
                <span id="data-timestamp-text">Updated: --</span>
            </div>
        </main>
    </div>
    <script type="module" src="js/pages/uv.js?v=20260821a"></script>
</body>
</html>
